[package]
name = "memegen"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust port of memegen.link with an MCP server"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
csscolorparser = "0.9.0"
emojis = "0.9.0"
gif = "0.14.2"
image = "0.25"
imageproc = "0.27.0"
libc = "0.2.190"
moka = { version = "0.12.16", features = ["sync"] }
percent-encoding = "2.3.2"
rayon = "1.12.0"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
webp = "0.3.1"

[profile.release]
lto = "thin"
codegen-units = 1
