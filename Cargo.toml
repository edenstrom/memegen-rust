[package]
name = "memegen"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust port of memegen.link with an MCP server"
license = "MIT"

[workspace]
members = ["worker"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["form", "json", "matched-path", "query"] }
base64 = "0.23.1"
bytes = "1.12.1"
crc32fast = "1.5.2"
csscolorparser = "0.9.0"
emojis = "0.9.0"
gif = "0.14.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "rayon", "webp"] }
image-webp = "0.2.4"
imageproc = "0.27.0"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
percent-encoding = "2.3.2"
rayon = "1.12.0"
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"
simd-adler32 = "0.3.10"
thiserror = "2.0.21"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
unicode-segmentation = "1.13.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.190"
moka = { version = "0.12.16", features = ["sync"] }
rmcp = { version = "3.5.1", features = ["transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webp = "0.3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rmcp's server feature pulls in uuid, which needs a randomness source on wasm.
uuid = { version = "1", features = ["js"] }

[profile.release]
lto = "thin"
codegen-units = 1
