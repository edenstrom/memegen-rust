name: Genie Rules
source: https://en.meming.world/wiki/Genie_Rules
description: Making a wish or request that exploits a loophole or breaks an unstated rule, like asking for something impossible. Single line is the wish itself.
keywords:
  - wish
  - want
  - Aladdin
  - loophole
  - bending the rules
  - impossible request
  - trolling
text:
  - style: default
    color: black
    font: thin
    anchor_x: 0.0
    anchor_y: 0.48
    angle: 0.0
    scale_x: 0.45
    scale_y: 0.15
    align: center
    start: 0.0
    stop: 1.0
example:
  - I want to divide by zero
overlay:
  - center_x: 0.5
    center_y: 0.5
    angle: 0.0
    scale: 0.25
    start: 0.0
    stop: 1.0
