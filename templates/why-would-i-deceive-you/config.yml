name: Why Would I Deceive You
description: "Elizabeth Holmes in Nathan Fielder's Theranos documentary \"You Can See Everything\": the interviewer leans in close, then Holmes answers wide-eyed with a deadpan smile, \"why would I deceive you\". For callouts and anyone caught red-handed in an obvious lie. Top line sets up the deception or the accusation; bottom line is the innocent denial, usually \"Why would I deceive you\"."
