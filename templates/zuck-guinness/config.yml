name: Zuck Pretending to Enjoy Guinness
description: "Mark Zuckerberg takes a long, dutiful gulp of Guinness at a pub table, then very visibly pretends to enjoy it: slow nods, pursed lips, a thoughtful stare into the distance. Faking enthusiasm for something you clearly don't like, to fit in or be polite. Top line is the thing being endured; bottom line is the unconvincing verdict."
keywords:
  - Mark Zuckerberg
  - Zuck
  - Guinness
  - beer
  - pub
  - pretending to enjoy
  - faking it
  - forced enjoyment
  - acquired taste
  - fitting in
  - being polite
  - unconvincing
  - relatable human
