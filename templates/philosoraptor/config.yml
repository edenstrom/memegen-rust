name: Philosoraptor
source: http://knowyourmeme.com/memes/philosoraptor
description: Pondering a clever-sounding but flawed deduction, usually built on wordplay; top line is the premise, bottom line is the twisted conclusion.
keywords:
  - logic
  - wordplay
  - pun
  - deep thoughts
  - shower thoughts
  - pseudo-intellectual
  - faulty logic
  - philosophy
text:
  - style: upper
    color: white
    font: impact
    anchor_x: 0.0
    anchor_y: 0.0
    angle: 0.0
    scale_x: 1.0
    scale_y: 0.2
    align: center
    start: 0.0
    stop: 1.0
  - style: upper
    color: white
    font: impact
    anchor_x: 0.0
    anchor_y: 0.8
    angle: 0.0
    scale_x: 1.0
    scale_y: 0.2
    align: center
    start: 0.0
    stop: 1.0
example:
  - if the earth is the third planet from the sun
  - then isn't every country a third world country?
overlay:
  - center_x: 0.5
    center_y: 0.5
    angle: 0.0
    scale: 0.25
    start: 0.0
    stop: 1.0
