name: Roll Safe
source: http://knowyourmeme.com/memes/roll-safe
description: 'Smug, faux-logical advice that sounds clever but is absurd: top line is the claim, bottom line the flawed condition behind it.'
keywords:
  - smug logic
  - faux logic
  - loophole
  - ironic advice
  - sarcasm
  - big brain
  - fake wisdom
text:
  - style: upper
    color: white
    font: impact
    anchor_x: 0.0
    anchor_y: 0.0
    angle: 0.0
    scale_x: 1.0
    scale_y: 0.2
    align: center
    start: 0.0
    stop: 1.0
  - style: upper
    color: white
    font: impact
    anchor_x: 0.0
    anchor_y: 0.8
    angle: 0.0
    scale_x: 1.0
    scale_y: 0.2
    align: center
    start: 0.0
    stop: 1.0
example:
  - can't get fired
  - if you don't have a job
overlay:
  - center_x: 0.5
    center_y: 0.5
    angle: 0.0
    scale: 0.25
    start: 0.0
    stop: 1.0
