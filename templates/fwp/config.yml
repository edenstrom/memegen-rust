name: First World Problems
source: http://knowyourmeme.com/memes/first-world-problems
description: Complaining about a trivial inconvenience as if it were a serious hardship; top line names the cause, bottom line the petty grievance.
keywords:
  - crying
  - trivial complaints
  - entitlement
  - online arguments
  - petty grievances
  - melodrama
  - sarcasm
text:
  - style: upper
    color: white
    font: impact
    anchor_x: 0.0
    anchor_y: 0.0
    angle: 0.0
    scale_x: 1.0
    scale_y: 0.2
    align: center
    start: 0.0
    stop: 1.0
  - style: upper
    color: white
    font: impact
    anchor_x: 0.0
    anchor_y: 0.8
    angle: 0.0
    scale_x: 1.0
    scale_y: 0.2
    align: center
    start: 0.0
    stop: 1.0
example:
  - someone on the internet
  - disagrees with me
overlay:
  - center_x: 0.5
    center_y: 0.5
    angle: 0.0
    scale: 0.25
    start: 0.0
    stop: 1.0
